<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="assets/fivecom.png" type="image/x-icon" />
    <title>Quadrado Girando</title>

    <style>
      body {
        background: #1F2A1F;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .containerheadStonks {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      a {
        color: #D9C7A3;
      }
      h1{
        color: white;
      }
      .containerStonks {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* A imagem gira; sem isto, a rotação cria rolagem lateral no celular. */
      html,
      body {
        overflow-x: hidden;
      }
      .quadrado {
        width: 320px;
        height: 320px;
        animation: girar 4s linear infinite;
        max-width: 90vw;
        height: auto;
      }

      .notStonks {
        margin-top: 50px;
        width: 520px;
        height: 520px;
        max-width: 90vw;
        object-fit: contain;
      }

      @keyframes girar {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
      <link rel="stylesheet" href="css/eco-animate.css" />
      <link rel="stylesheet" href="css/eco-interacoes.css" />
  </head>

  <body>
    <div>
      <img src="assets/prof.webp" alt="error" class="quadrado" />
    </div>
    <h1 id="textoErro">estamos trabalhando nisso ok? 👍</h1>
    <div class="containerStonks">
      <img src="assets/notStonks.png" alt="error" class="notStonks" />
    </div>
    <h2><a href="index.html">VOLTAR</a></h2>
    <script>
      const textoErro = new URLSearchParams(location.search).get("erro");
      if (textoErro) document.getElementById("textoErro").textContent = textoErro;
    </script>
    <script src="js/eco-animate.js"></script>
    <script src="js/eco-interacoes.js"></script>
    <script src="js/eco-voltar.js"></script>
  </body>
</html>
