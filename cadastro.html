<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./assets/fivecom.png" type="image/x-icon" />
    <title>Cadastro — EcoTech</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/cadastro.css" />
    <link rel="stylesheet" href="./css/eco-animate.css" />
    <link rel="stylesheet" href="./css/eco-interacoes.css" />
  </head>
  <body>
    <a href="login.html" class="btn-back" aria-label="Voltar para o login">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M19 12H5"></path>
        <path d="M12 19l-7-7 7-7"></path>
      </svg>
    </a>

    <button
      class="theme-toggle-float"
      id="theme-toggle"
      aria-label="Alternar tema"
    >
      <span id="theme-icon">☀️</span>
    </button>

    <main class="page">
      <section class="app">
        <div class="side-photo">
          <img src="./assets/sua-foto-lateral.jpg" alt="" class="eco-kenburns" />
          <div class="hero-leaves" data-qtd-folhas="5"></div>
          <div class="side-photo-text">
            Bem-vindo a<br />uma vida mais<br />sustentável.
          </div>
        </div>

        <section class="register">
          <div class="eco-logo">
            <img src="./assets/logo.svg" alt="EcoTech" />
          </div>
          <h1>Crie sua conta!</h1>
          <p>
            Cadastre-se para acompanhar nossos projetos e fazer parte da
            EcoTech.
          </p>

          <div class="tabs-nav">
            <button
              type="button"
              class="tab-btn active"
              id="tabBtnPessoal"
              data-tab="pessoal"
            >
              <span class="tab-num">1</span> Dados Pessoais
            </button>
            <button
              type="button"
              class="tab-btn"
              id="tabBtnEndereco"
              data-tab="endereco"
            >
              <span class="tab-num">2</span> Endereço
            </button>
          </div>

          <form id="formCadastro" autocomplete="off">
            <!-- ═══════════ ABA 1 — DADOS PESSOAIS ═══════════ -->
            <div class="tab-panel" data-panel="pessoal">
              <label for="email">E-mail</label>
              <div class="input-box">
                <span>✉</span>
                <input
                  id="email" name="email"
                  type="email"
                  placeholder="seu@email.com"
                  maxlength="120"
                  required
                />
              </div>

              <label for="cpf">CPF</label>
              <div class="input-box">
                <span>▣</span>
                <input
                  id="cpf" name="cpf"
                  type="text"
                  placeholder="000.000.000-00"
                  maxlength="14"
                  required
                />
              </div>

              <label for="nome">Nome completo</label>
              <div class="input-box">
                <span>👤</span>
                <input
                  id="nome" name="nome"
                  type="text"
                  placeholder="Digite seu nome completo"
                  maxlength="80"
                  required
                />
              </div>

              <label for="nomeMae">Nome da mãe</label>
              <div class="input-box">
                <span>👩</span>
                <input
                  id="nomeMae" name="nome_materno"
                  type="text"
                  placeholder="Digite o nome da sua mãe"
                  maxlength="80"
                  required
                />
              </div>

              <label for="nascimento">Sua data de nascimento</label>
              <div class="input-box">
                <span>📅</span>
                <input id="nascimento" name="data_nascimento" type="date" required />
              </div>

              <label for="sexo">Sexo</label>
              <div class="input-box">
                <span>⚧</span>
                <select id="sexo" name="sexo" required>
                  <option value="">Selecione…</option>
                  <option value="feminino">Feminino</option>
                  <option value="masculino">Masculino</option>
                  <option value="outro">Outro</option>
                  <option value="nao_informar">Prefiro não informar</option>
                </select>
              </div>

              <label for="telefoneCelular">Telefone Celular</label>
              <div class="input-box">
                <span>📱</span>
                <input
                  id="telefoneCelular" name="telefone_celular"
                  type="text"
                  placeholder="(XX) XXXXX-XXXX"
                  maxlength="15"
                  inputmode="tel"
                  required
                />
              </div>

              <label for="telefoneFixo">Telefone Fixo <span class="eco-opcional">(opcional)</span></label>
              <div class="input-box">
                <span>☎</span>
                <input
                  id="telefoneFixo" name="telefone_fixo"
                  type="text"
                  placeholder="(XX) XXXX-XXXX"
                  maxlength="14"
                  inputmode="tel"
                />
              </div>

              <label for="login"
                >Login <small style="font-weight: 400">(exatamente 6 letras)</small></label
              >
              <div class="input-box">
                <span>🆔</span>
                <input
                  id="login" name="login"
                  type="text"
                  placeholder="Ex: JOAOSV"
                  maxlength="6"
                  required
                />
              </div>

              <label for="senha">Senha</label>
              <div class="input-box">
                <span>🔒</span>
                <input
                  id="senha" name="senha"
                  type="password"
                  placeholder="Exatamente 8 letras"
                  maxlength="8"
                  required
                />
                <span class="eye" onclick="togglePassword('senha')">◎</span>
              </div>

              <label for="confirmarSenha">Confirmar senha</label>
              <div class="input-box">
                <span>🔐</span>
                <input
                  id="confirmarSenha" name="confirmar_senha"
                  type="password"
                  placeholder="Digite novamente sua senha"
                  maxlength="8"
                  required
                />
                <span class="eye" onclick="togglePassword('confirmarSenha')"
                  >◎</span
                >
              </div>

              <button type="button" id="btnProximo">
                Próximo: Endereço →
              </button>
            </div>

            <!-- ═══════════ ABA 2 — ENDEREÇO ═══════════ -->
            <div class="tab-panel" data-panel="endereco" hidden>
              <label for="cep">CEP</label>
              <div class="input-box">
                <span>📍</span>
                <input
                  id="cep" name="cep"
                  type="text"
                  placeholder="00000-000"
                  maxlength="9"
                  required
                />
              </div>

              <label for="logradouro">Endereço (rua/avenida)</label>
              <div class="input-box">
                <span>🏠</span>
                <input
                  id="logradouro" name="endereco"
                  type="text"
                  placeholder="Preenchido automaticamente pelo CEP"
                  required
                />
              </div>

              <div class="field-row">
                <div style="flex: 1">
                  <label for="numero">Número <span class="eco-opcional">(opcional)</span></label>
                  <div class="input-box">
                    <span>#</span>
                    <input id="numero" type="text" placeholder="Ex.: 100" />
                  </div>
                </div>
                <div style="flex: 2">
                  <label for="bairro">Bairro</label>
                  <div class="input-box">
                    <span>▤</span>
                    <input id="bairro" type="text" required />
                  </div>
                </div>
              </div>

              <div class="field-row">
                <div style="flex: 2">
                  <label for="cidade">Cidade</label>
                  <div class="input-box">
                    <span>🏙</span>
                    <input id="cidade" type="text" required />
                  </div>
                </div>
                <div style="flex: 1">
                  <label for="uf">UF</label>
                  <div class="input-box">
                    <span>▣</span>
                    <input id="uf" type="text" maxlength="2" required />
                  </div>
                </div>
              </div>

              <div class="terms-card">
                <label class="terms-label">
                  <input type="checkbox" id="aceitarTermos" />
                  <span>
                    Ao criar uma conta, você concorda com nossos
                    <a
                      href="https://www.termsfeed.com/live/7f2df7c4-3d8c-4c6a-b5b8-2e9f8b4c8f95"
                      target="_blank"
                      >Termos e Condições</a
                    >
                    e nossa Política de Privacidade.
                  </span>
                </label>
              </div>

              <div class="form-actions">
                <button type="button" id="btnVoltarTab" class="btn-ghost">
                  ← Voltar
                </button>
                <button type="submit">Cadastrar</button>
              </div>
              <button
                type="button"
                id="btnLimparTela"
                class="btn-ghost"
                style="margin-top: 10px"
              >
                Limpar tudo
              </button>
            </div>
          </form>

          <small>Já tem uma conta? <a href="login.html">Entrar</a></small>
        </section>
      </section>
    </main>

    <div class="toast" id="toast"></div>

    <script src="js/api.js"></script>
    <script src="js/ui-theme.js"></script>
    <script src="js/eco-animate.js"></script>
    <script src="js/eco-interacoes.js"></script>
    <script src="js/ui-toast.js"></script>
    <script src="js/eco-helpers.js"></script>
    <script>
      initTheme();
      initThemeToggle();

      /* ── Máscaras e autopreenchimento ── */
      aplicarMascaraComCursor(document.getElementById("telefoneCelular"), formatarTelefoneCelular);
      aplicarMascaraComCursor(document.getElementById("telefoneFixo"), formatarTelefoneFixo);
      aplicarMascaraComCursor(document.getElementById("cpf"), formatarCPF);
      aplicarMascaraComCursor(document.getElementById("cep"), formatarCEP);
      document.getElementById("cep").addEventListener("blur", async (e) => {
        const resultado = await buscarEnderecoPorCEP(e.target.value, {
          logradouro: document.getElementById("logradouro"),
          bairro: document.getElementById("bairro"),
          cidade: document.getElementById("cidade"),
          uf: document.getElementById("uf"),
        });
        if (!resultado.ok) showToast(resultado.motivo);
      });
      document.getElementById("login").addEventListener("input", (e) => {
        e.target.value = e.target.value.replace(/[^A-Za-zÀ-ÿ]/g, "").slice(0, 6);
      });
      document.getElementById("btnLimparTela").addEventListener("click", () => {
        document.getElementById("formCadastro").reset();
        irParaAba("pessoal");
      });

      /* ══════════════════════════════════════════════
         NAVEGAÇÃO ENTRE ABAS
      ══════════════════════════════════════════════ */
      const abas = {
        pessoal: {
          btn: document.getElementById("tabBtnPessoal"),
          panel: document.querySelector('[data-panel="pessoal"]'),
        },
        endereco: {
          btn: document.getElementById("tabBtnEndereco"),
          panel: document.querySelector('[data-panel="endereco"]'),
        },
      };

      function irParaAba(nome) {
        Object.entries(abas).forEach(([chave, aba]) => {
          const ativa = chave === nome;
          aba.btn.classList.toggle("active", ativa);
          aba.panel.hidden = !ativa;
        });
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      /* Só permite clicar diretamente na aba "Endereço" se os
         dados pessoais já foram validados (senão força o fluxo
         pelo botão "Próximo", que valida antes de avançar). */
      abas.endereco.btn.addEventListener("click", () => {
        if (validarAbaPessoal(true)) irParaAba("endereco");
      });
      abas.pessoal.btn.addEventListener("click", () => irParaAba("pessoal"));

      document.getElementById("btnProximo").addEventListener("click", () => {
        if (validarAbaPessoal()) irParaAba("endereco");
      });
      document.getElementById("btnVoltarTab").addEventListener("click", () => {
        irParaAba("pessoal");
      });

      /* ── Validação da Aba 1 (Dados Pessoais) ── */
      function validarAbaPessoal(silencioso) {
        const nome = cleanText(document.getElementById("nome").value);
        const email = cleanText(document.getElementById("email").value).toLowerCase();
        const cpf = document.getElementById("cpf").value.trim();
        const nomeMae = cleanText(document.getElementById("nomeMae").value);
        const nascimento = document.getElementById("nascimento").value;
        const sexo = document.getElementById("sexo").value;
        const telefoneCelular = document.getElementById("telefoneCelular").value.trim();
        const telefoneFixo = document.getElementById("telefoneFixo").value.trim();
        const login = document.getElementById("login").value.trim();
        const senha = document.getElementById("senha").value;
        const confirmarSenha = document.getElementById("confirmarSenha").value;

        const avisar = (msg) => {
          if (!silencioso) showToast(msg);
          return false;
        };

        if (
          !nome || !email || !cpf || !nomeMae || !nascimento || !sexo ||
          !telefoneCelular || !login || !senha || !confirmarSenha
        ) {
          return avisar("Preencha todos os campos de Dados Pessoais.");
        }
        if (nome.length < 15 || nome.length > 80) {
          return avisar("O nome deve ter entre 15 e 80 caracteres.");
        }
        if (nomeMae.length < 3) {
          return avisar("Nome da mãe inválido.");
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          return avisar("E-mail inválido.");
        }
        if (!validarCPF(cpf)) {
          return avisar("CPF inválido.");
        }
        if (!telefoneValido(telefoneCelular, 9) || (telefoneFixo && !telefoneValido(telefoneFixo, 8))) {
          return avisar("Telefones devem seguir o formato (XX) XXXXX-XXXX.");
        }
        if (!validarLoginField(login)) {
          return avisar("O Login deve ter exatamente 6 caracteres alfabéticos.");
        }
        if (calcularIdade(nascimento) < 13) {
          return avisar("Cadastro permitido apenas para maiores de 13 anos.");
        }
        if (!senhaValidaApi(senha)) {
          return avisar("A senha deve ter exatamente 8 letras.");
        }
        if (senha !== confirmarSenha) {
          return avisar("As senhas não coincidem.");
        }
        return true;
      }

      /* ── Validação da Aba 2 (Endereço) ── */
      function validarAbaEndereco() {
        const cep = document.getElementById("cep").value.trim();
        const logradouro = cleanText(document.getElementById("logradouro").value);
        const numero = cleanText(document.getElementById("numero").value);
        const bairro = cleanText(document.getElementById("bairro").value);
        const cidade = cleanText(document.getElementById("cidade").value);
        const uf = cleanText(document.getElementById("uf").value);

        if (!cep || !logradouro || !bairro || !cidade || !uf) {
          showToast("Preencha todos os campos de Endereço.");
          return false;
        }
        if (!document.getElementById("aceitarTermos").checked) {
          showToast("Você precisa aceitar os Termos e Condições.");
          return false;
        }
        return true;
      }

      /* ══════════════════════════════════════════════
         VALIDAÇÃO EM TEMPO REAL (por campo, ao sair dele)
         Camada de UX que dá feedback imediato — a validação
         "de verdade" que decide se avança de aba ou envia o
         formulário continua sendo validarAbaPessoal/Endereco
         acima, essa aqui só ajuda a pessoa a perceber o erro
         mais cedo, sem esperar até apertar "Próximo".
      ══════════════════════════════════════════════ */
      function marcarCampo(input, valido, mensagem, mostrarIcone = true) {
        const box = input.closest(".input-box");
        if (!box) return;
        box.classList.remove("campo-valido", "campo-invalido");

        let msg = box.parentElement.querySelector(
          `.field-msg[data-for="${input.id}"]`,
        );
        if (!msg) {
          msg = document.createElement("small");
          msg.className = "field-msg";
          msg.dataset.for = input.id;
          box.insertAdjacentElement("afterend", msg);
        }

        let check = box.querySelector(".field-check");

        if (input.value.trim() === "") {
          msg.textContent = "";
          if (check) check.textContent = "";
          return;
        }

        box.classList.add(valido ? "campo-valido" : "campo-invalido");
        msg.textContent = valido ? "" : mensagem || "";

        if (mostrarIcone) {
          if (!check) {
            check = document.createElement("span");
            check.className = "field-check";
            box.appendChild(check);
          }
          check.textContent = valido ? "✓" : "✕";
        }
      }

      const validadoresPorCampo = {
        email: (v) => ({
          ok: /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanText(v).toLowerCase()),
          msg: "Formato de e-mail inválido.",
        }),
        cpf: (v) => ({ ok: validarCPF(v), msg: "CPF inválido." }),
        nome: (v) => {
          const n = cleanText(v);
          return {
            ok: n.length >= 15 && n.length <= 80,
            msg: "Deve ter entre 15 e 80 caracteres.",
          };
        },
        nomeMae: (v) => ({
          ok: cleanText(v).length >= 3,
          msg: "Nome muito curto.",
        }),
        nascimento: (v) => ({
          ok: !!v && calcularIdade(v) >= 13,
          msg: "É preciso ter 13 anos ou mais.",
        }),
        telefoneCelular: (v) => ({
          ok: telefoneValido(v, 9),
          msg: "Formato esperado: (XX) XXXXX-XXXX",
        }),
        telefoneFixo: (v) => ({
          ok: !v.trim() || telefoneValido(v, 8),
          msg: "Formato esperado: (XX) XXXX-XXXX",
        }),
        login: (v) => ({
          ok: validarLoginField(v),
          msg: "Precisa ter exatamente 6 letras.",
        }),
        senha: (v) => ({
          ok: senhaValidaApi(v),
          msg: "A senha deve ter exatamente 8 letras.",
        }),
        confirmarSenha: (v) => ({
          ok: v === document.getElementById("senha").value && v !== "",
          msg: "As senhas não coincidem.",
        }),
        cep: (v) => ({
          ok: v.replace(/[^\d]/g, "").length === 8,
          msg: "CEP incompleto.",
        }),
        numero: () => ({ ok: true, msg: "" }),
        bairro: (v) => ({ ok: cleanText(v).length > 1, msg: "" }),
        cidade: (v) => ({ ok: cleanText(v).length > 1, msg: "" }),
        uf: (v) => ({
          ok: /^[A-Za-zÀ-ÿ]{2}$/.test(cleanText(v)),
          msg: "Use a sigla com 2 letras (ex: RJ).",
        }),
      };

      const CAMPOS_SEM_ICONE = new Set(["senha", "confirmarSenha"]);

      Object.keys(validadoresPorCampo).forEach((id) => {
        const input = document.getElementById(id);
        if (!input) return;
        const semIcone = CAMPOS_SEM_ICONE.has(id);
        input.addEventListener("blur", () => {
          const resultado = validadoresPorCampo[id](input.value);
          marcarCampo(input, resultado.ok, resultado.msg, !semIcone);
        });
        // Se o campo já estava marcado como inválido e a pessoa
        // volta a digitar, re-checa a cada tecla (feedback mais
        // ágil pra corrigir), mas só depois da primeira tentativa.
        input.addEventListener("input", () => {
          const box = input.closest(".input-box");
          if (box && box.classList.contains("campo-invalido")) {
            const resultado = validadoresPorCampo[id](input.value);
            marcarCampo(input, resultado.ok, resultado.msg, !semIcone);
          }
        });
      });

      /* A confirmação de senha depende do valor de "senha", então
         reavalia ela também quando "senha" muda (caso já tenha
         sido preenchida antes). */
      document.getElementById("senha").addEventListener("input", () => {
        const confirmar = document.getElementById("confirmarSenha");
        if (confirmar.value.trim() !== "") {
          const resultado = validadoresPorCampo.confirmarSenha(confirmar.value);
          marcarCampo(confirmar, resultado.ok, resultado.msg, false);
        }
      });

      /* ══════════════════════════════════════════════
         ENVIO DO CADASTRO
      ══════════════════════════════════════════════ */
      document
        .getElementById("formCadastro")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          limparErrosCampos();

          // Revalida as duas abas (a pessoa pode ter voltado e alterado algo).
          if (!validarAbaPessoal()) {
            irParaAba("pessoal");
            return;
          }
          if (!validarAbaEndereco()) return;

          const valor = (id) => document.getElementById(id).value.trim();
          const sexo = { feminino: "F", masculino: "M" }[valor("sexo")] || "O";
          const corpo = {
            nome: cleanText(valor("nome")),
            data_nascimento: valor("nascimento"),
            sexo,
            nome_materno: cleanText(valor("nomeMae")),
            cpf: valor("cpf"),
            email: valor("email").toLowerCase(),
            telefone_celular: telefoneParaApi(valor("telefoneCelular")),
            telefone_fixo: valor("telefoneFixo") ? telefoneParaApi(valor("telefoneFixo")) : "",
            cep: valor("cep"),
            endereco: `${cleanText(valor("logradouro"))}, ${cleanText(valor("numero")) || "s/n"} - ${cleanText(valor("bairro"))} - ${cleanText(valor("cidade"))}/${valor("uf").toUpperCase()}`,
            login: valor("login"),
            senha: document.getElementById("senha").value,
            confirmar_senha: document.getElementById("confirmarSenha").value,
          };

          const btn = document.querySelector("#formCadastro button[type='submit']");
          btn.textContent = "Cadastrando...";
          btn.disabled = true;
          const r = await api("/usuarios", { metodo: "POST", corpo });
          btn.textContent = "Cadastrar";
          btn.disabled = false;

          if (r.sucesso) {
            if (typeof window.ecoConfete === "function") window.ecoConfete();
            showToast(r.dados?.mensagem || "Cadastro realizado com sucesso!", true);
            setTimeout(() => (window.location.href = "login.html"), 2000);
            return;
          }
          if (r.status >= 500) return irParaErro(r.erro);

          showToast(r.erro || "Não foi possível cadastrar.");
          if (r.campos) {
            mostrarErrosCampos(r.campos);
            const primeiro = document.querySelector(`[name="${Object.keys(r.campos)[0]}"]`);
            if (primeiro) irParaAba(primeiro.closest(".tab-panel").dataset.panel);
          }
        });
    </script>
  </body>
</html>
