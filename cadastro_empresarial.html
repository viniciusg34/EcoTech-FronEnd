<!doctype html>
<html lang="pt-br" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="assets/fivecom.png" type="image/x-icon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/cadastro_empresarial.css" />
    <link rel="stylesheet" href="css/eco-animate.css" />
    <link rel="stylesheet" href="css/eco-interacoes.css" />
    <title>Cadastro Empresarial — EcoTech</title>
    <script>
      (function () {
        const saved = localStorage.getItem("eco-theme");
        const pref =
          saved ||
          (window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
        document.documentElement.setAttribute("data-theme", pref);
      })();
    </script>
  </head>
  <body>
    <a href="login.html" class="btn-back-float" aria-label="Voltar para o login"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></a>
    <button class="theme-toggle" id="theme-toggle" aria-label="Alternar tema">
      <span id="theme-icon">☀️</span>
    </button>

    <main class="main-split-container">
      <div class="split-card">
        <div class="side-panel-visual">
          <div class="organic-shape"></div>
          <div class="hero-leaves" data-qtd-folhas="5"></div>
          <div class="visual-content">
            <span class="top-tag">Cadastro Empresarial</span>
            <h1>Cadastre sua empresa e faça parte da mudança.</h1>
          </div>
          <img
            src="assets/predio-sustentavel.jpg"
            alt="Fachada corporativa sustentável EcoTech"
            class="building-img eco-kenburns"
          />
        </div>

        <div class="side-panel-form">
          <div class="form-wrapper">
            <div class="form-header">
              <h2>Cadastro Empresarial</h2>
              <p>Preencha os dados da sua empresa para criar sua conta</p>
            </div>

            <form id="cadastroEmpresarialForm" action="#" method="POST">
              <div class="input-group">
                <label for="cnpj">CNPJ</label>
                <input
                  type="text"
                  id="cnpj" name="cnpj"
                  name="cnpj"
                  placeholder="00.000.000/0000-00"
                  required
                  autocomplete="off"
                  maxlength="18"
                />
              </div>
              <div class="input-group">
                <label for="nome_empresa">Nome Completo da Empresa</label>
                <input
                  type="text"
                  id="nome_empresa" name="name"
                  name="nome_empresa"
                  placeholder="Digite o nome completo da empresa"
                  required
                  autocomplete="organization"
                />
              </div>
              <div class="input-group">
                <label for="endereco">Endereço <span class="eco-opcional">(opcional)</span></label>
                <input
                  type="text"
                  id="endereco" name="adress"
                  placeholder="Rua, número, bairro, cidade, Estado, CEP"
                  autocomplete="street-address"
                />
              </div>
              <div class="input-group">
                <label for="razao_social">Razão Social <span class="eco-opcional">(opcional)</span></label>
                <input
                  type="text"
                  id="razao_social"
                  name="razao_social"
                  placeholder="Digite a razão social da empresa"
                />
              </div>
              <div class="input-group">
                <label for="email">E-mail</label>
                <input
                  type="email"
                  id="email" name="email"
                  name="email"
                  placeholder="exemplo@empresa.com.br"
                  required
                  autocomplete="email"
                />
              </div>
              <div class="input-group group-password">
                <label for="password">Senha</label>
                <div class="password-field-wrapper">
                  <input
                    type="password"
                    id="password" name="password"
                    name="password"
                    placeholder="Crie uma senha segura"
                    required
                    autocomplete="new-password"
                  />
                  <button
                    type="button"
                    class="toggle-password-visibility"
                    id="btnTogglePassword"
                    aria-label="Mostrar ou ocultar senha"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      class="eye-icon"
                    >
                      <path
                        d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                      ></path>
                      <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn-submit-account">
                Criar Conta
              </button>

              <div class="form-footer-toggle">
                <span
                  >Já possui uma conta? <a href="login.html">Entrar</a></span
                >
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <div class="toast" id="toast"></div>

    <script>
      "use strict";

      /* 1. TEMA */
      const THEME_KEY = "eco-theme";
      const htmlEl = document.documentElement;
      function applyTheme(theme) {
        htmlEl.setAttribute("data-theme", theme);
        localStorage.setItem(THEME_KEY, theme);
      }
      applyTheme(htmlEl.getAttribute("data-theme") || "light");

      const btnTema = document.getElementById("theme-toggle");
      const iconeTema = document.getElementById("theme-icon");
      if (btnTema && iconeTema) {
        iconeTema.textContent =
          htmlEl.getAttribute("data-theme") === "dark" ? "🌙" : "☀️";
        btnTema.addEventListener("click", () => {
          const novoTema =
            htmlEl.getAttribute("data-theme") === "dark" ? "light" : "dark";
          applyTheme(novoTema);
          iconeTema.textContent = novoTema === "dark" ? "🌙" : "☀️";
        });
      }

      /* 2. MÁSCARA CNPJ */
      const cnpjInput = document.getElementById("cnpj");
      if (cnpjInput) {
        cnpjInput.addEventListener("input", (e) => {
          let v = e.target.value.replace(/\D/g, "").slice(0, 14);
          v = v.replace(/^(\d{2})(\d)/, "$1.$2");
          v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
          v = v.replace(/\.(\d{3})(\d)/, ".$1/$2");
          v = v.replace(/(\d{4})(\d)/, "$1-$2");
          e.target.value = v;
        });
      }

      /* 3. TOGGLE SENHA */
      const btnTogglePassword = document.getElementById("btnTogglePassword");
      const passwordInput = document.getElementById("password");
      if (btnTogglePassword && passwordInput) {
        btnTogglePassword.addEventListener("click", () => {
          const isPassword = passwordInput.type === "password";
          passwordInput.type = isPassword ? "text" : "password";
          btnTogglePassword.classList.toggle("visible", isPassword);
        });
      }

      /* 4. TOAST */
      function showToast(msg, success = false) {
        const toast = document.getElementById("toast");
        toast.textContent = msg;
        toast.style.background = success ? "#3E5A3F" : "";
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 3500);
      }

      /* 5. VALIDAÇÕES */
      function validarCNPJ(cnpj) {
        return cnpj.replace(/\D/g, "").length === 14;
      }

      function senhaSegura(senha) {
        return (
          senha.length >= 8 &&
          /[A-Z]/.test(senha) &&
          /[a-z]/.test(senha) &&
          /\d/.test(senha)
        );
      }

      /* 6. ENVIO PARA A API */

      document
        .getElementById("cadastroEmpresarialForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const cnpj = cnpjInput.value.trim();
          const nomeEmpresa = document
            .getElementById("nome_empresa")
            .value.trim();
          const endereco = document.getElementById("endereco").value.trim();
          const razaoSocial = document
            .getElementById("razao_social")
            .value.trim();
          const email = document
            .getElementById("email")
            .value.trim()
            .toLowerCase();
          const senha = passwordInput.value;

          /* Validações */
          if (!cnpj || !nomeEmpresa || !email || !senha) {
            showToast("Preencha todos os campos.");
            return;
          }
          if (!validarCNPJ(cnpj)) {
            showToast("CNPJ inválido. Use o formato 00.000.000/0000-00.");
            return;
          }
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showToast("E-mail inválido.");
            return;
          }
          if (!senhaSegura(senha)) {
            showToast(
              "A senha precisa ter 8+ caracteres, maiúscula, minúscula e número.",
            );
            return;
          }

          limparErrosCampos();
          const r = await api("/empresas", {
            metodo: "POST",
            corpo: {
              name: nomeEmpresa,
              cnpj,
              ...(endereco ? { adress: endereco } : {}),
              email,
              password: senha,
              colected: 0,
            },
          });

          if (r.sucesso) {
            if (typeof window.ecoConfete === "function") window.ecoConfete();
            showToast("✅ Cadastro realizado com sucesso! Bem-vinda à EcoTech 🌿", true);
            setTimeout(() => (window.location.href = "login.html"), 2200);
            return;
          }
          if (r.status >= 500) return irParaErro(r.erro);
          showToast(r.erro || "Erro ao cadastrar empresa. Tente novamente.");
          if (r.campos) mostrarErrosCampos(r.campos);
        });
    </script>
    <script src="js/api.js"></script>
    <script src="js/eco-animate.js"></script>
    <script src="js/eco-interacoes.js"></script>
  </body>
</html>
