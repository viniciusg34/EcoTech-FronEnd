<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./assets/fivecom.png" type="image/x-icon" />
    <title>Segundo Fator de Autenticação — EcoTech</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/admin-shared.css?v=2" />
    <style>
      .twofa-shell {
        max-width: 460px;
        margin: 60px auto;
        padding: 0 20px;
      }
      .twofa-icon {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: var(--sage-50);
        border: 1.5px solid var(--sage-100);
        display: grid;
        place-items: center;
        font-size: 26px;
        margin-bottom: 16px;
      }
      .question-box {
        background: var(--sage-50);
        border: 1.5px solid var(--sage-100);
        border-radius: var(--br-md);
        padding: 16px 18px;
        margin-bottom: 18px;
        font-weight: 700;
        color: var(--ink-2);
      }
      .attempts-note {
        font-size: 0.8rem;
        color: var(--ink-3);
        margin-top: 12px;
        text-align: center;
      }
      .attempts-note strong { color: var(--danger); }
    </style>
      <link rel="stylesheet" href="css/eco-animate.css" />
      <link rel="stylesheet" href="css/eco-interacoes.css?v=2" />
      <link rel="stylesheet" href="css/eco-arte-fundo.css?v=4" />
  </head>
  <body>
    <header class="admin-header">
      <a href="index.html" class="brand">
        <img src="./assets/logo.svg" alt="" />
        <span><em>Eco</em>Tech</span>
      </a>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Alternar tema">
          <span id="theme-icon">☀️</span>
        </button>
      </div>
    </header>

    <main class="admin-main twofa-shell secao-arte-tela" data-arte-fundo="seguranca">
      <div class="card">
        <div class="twofa-icon">🔐</div>
        <h1 class="admin-title" style="margin-bottom:6px;">Confirme que é você</h1>
        <p class="admin-subtitle" style="margin-bottom:20px;">
          Por segurança, pedimos uma segunda confirmação antes de liberar o acesso.
        </p>

        <div class="question-box" id="question-text">Carregando pergunta…</div>

        <form id="form2fa">
          <div class="field">
            <label for="resposta">Sua resposta</label>
            <input id="resposta" type="text" autocomplete="off" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="btnConfirmar">
            Confirmar
          </button>
        </form>

        <p class="attempts-note" id="attemptsNote"></p>

        <p style="text-align:center;margin-top:18px;">
          <a href="login.html" class="btn-back-pill" id="btnCancelar">← Cancelar e voltar ao login</a>
        </p>
      </div>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./js/ui-theme.js"></script>
    <script src="./js/ui-toast.js"></script>
    <script src="./js/eco-helpers.js"></script>
    <script src="./js/config.js?v=6"></script>
    <script src="./js/api.js?v=7"></script>
    <script>
      initTheme();
      initThemeToggle();

      /* Estado do desafio vem do login (id + pergunta); nenhum dado
         pessoal é guardado no navegador. A conferência é no servidor. */
      const pendente = Auth.ler2fa();
      if (!pendente || !pendente.desafio_id) {
        window.location.replace("login.html");
        throw new Error("Sem 2FA pendente — redirecionando para o login.");
      }

      /* Só máscara/teclado de digitação; a resposta é validada pela API. */
      const CONFIG_CAMPO = {
        nome_mae: { placeholder: "Nome completo", maxlength: "80", inputmode: "text", mascara: null },
        nascimento: { placeholder: "dd/mm/aaaa", maxlength: "10", inputmode: "numeric", mascara: formatarDataBR },
        cep: { placeholder: "00000-000", maxlength: "9", inputmode: "numeric", mascara: formatarCEP },
      };
      const campo = CONFIG_CAMPO[Auth.tipoPergunta(pendente)] || {
        placeholder: "",
        maxlength: null,
        inputmode: "text",
        mascara: null,
      };

      const inputResposta = document.getElementById("resposta");
      document.getElementById("question-text").textContent = pendente.pergunta || "";
      inputResposta.placeholder = campo.placeholder;
      if (campo.maxlength) inputResposta.setAttribute("maxlength", campo.maxlength);
      inputResposta.setAttribute("inputmode", campo.inputmode);

      /* ── Máscara no campo de resposta (preserva o cursor) ── */
      inputResposta.addEventListener("input", () => {
        if (!campo.mascara) return;

        const posAntes = inputResposta.selectionStart || 0;
        const digitosAntesCursor = inputResposta.value
          .slice(0, posAntes)
          .replace(/[^\d]/g, "").length;

        const formatado = campo.mascara(inputResposta.value);
        inputResposta.value = formatado;

        let pos = 0;
        let vistos = 0;
        while (pos < formatado.length && vistos < digitosAntesCursor) {
          if (/\d/.test(formatado[pos])) vistos++;
          pos++;
        }
        inputResposta.setSelectionRange(pos, pos);
      });

      function atualizarNotaTentativas(restantes) {
        document.getElementById("attemptsNote").innerHTML =
          typeof restantes === "number"
            ? `Tentativas restantes: <strong>${restantes}</strong>`
            : "";
      }

      function desafioEncerrado(err) {
        const texto = `${err.erro || ""} ${err.message || ""}`;
        const restantes = err.data && err.data.tentativas_restantes;
        return (
          err.status === 410 ||
          err.status === 423 ||
          restantes === 0 ||
          /bloquead|expirad/i.test(texto)
        );
      }

      document.getElementById("btnCancelar").addEventListener("click", () => {
        Auth.limpar2fa();
      });

      /* ── Confirmar: POST /auth/2fa ── */
      document.getElementById("form2fa").addEventListener("submit", async function (e) {
        e.preventDefault();
        const resposta = inputResposta.value;
        if (!resposta.trim()) {
          showToast("Preencha a resposta.");
          return;
        }

        const btn = document.getElementById("btnConfirmar");
        btn.disabled = true;
        try {
          const r = await Auth.verificar2fa(pendente.desafio_id, resposta, pendente.lembrar);

          // Resposta certa: falta o código de 6 dígitos que a API mandou por e-mail
          if (r && r.status === "codigo_email") {
            Auth.limpar2fa();
            showToast("Resposta certa! Agora digite o código do e-mail.");
            setTimeout(() => Auth.irParaCodigo(r, pendente.lembrar), 700);
            return;
          }

          Session.save(r, pendente.lembrar);
          Auth.limpar2fa();
          showToast("Identidade confirmada! Entrando…");
          setTimeout(() => {
            window.location.href = Auth.destinoPosLogin(r.usuario);
          }, 900);
        } catch (err) {
          if (err.name === "ApiError" && desafioEncerrado(err)) {
            Auth.limpar2fa();
            showToast("3 tentativas sem sucesso! Favor realizar Login novamente.");
            setTimeout(() => (window.location.href = "login.html"), 1600);
            return;
          }
          Api.showError(err, "Resposta incorreta. Tente novamente.");
          const restantes = err.data && err.data.tentativas_restantes;
          atualizarNotaTentativas(restantes);
          inputResposta.value = "";
          btn.disabled = false;
        }
      });
    </script>
    <script src="js/eco-animate.js"></script>
    <script src="js/eco-interacoes.js"></script>
    <script src="js/eco-voltar.js?v=3"></script>
    <script src="js/eco-arte-fundo.js?v=2"></script>
      <script src="js/eco-acessibilidade.js?v=2"></script>
  </body>
</html>
