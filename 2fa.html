<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./assets/fivecom.png" type="image/x-icon" />
    <title>Segundo Fator de Autenticação — EcoTech</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/admin-shared.css" />
    <style>
      .twofa-shell {
        max-width: 460px;
        margin: 60px auto;
        padding: 0 20px;
      }
      .twofa-icon {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: var(--sage-50);
        border: 1.5px solid var(--sage-100);
        display: grid;
        place-items: center;
        font-size: 26px;
        margin-bottom: 16px;
      }
      .question-box {
        background: var(--sage-50);
        border: 1.5px solid var(--sage-100);
        border-radius: var(--br-md);
        padding: 16px 18px;
        margin-bottom: 18px;
        font-weight: 700;
        color: var(--ink-2);
      }
      .attempts-note {
        font-size: 0.8rem;
        color: var(--ink-3);
        margin-top: 12px;
        text-align: center;
      }
      .attempts-note strong { color: var(--danger); }
    </style>
      <link rel="stylesheet" href="css/eco-animate.css" />
      <link rel="stylesheet" href="css/eco-interacoes.css" />
  </head>
  <body>
    <header class="admin-header">
      <a href="index.html" class="brand">
        <img src="./assets/logo.svg" alt="" />
        <span><em>Eco</em>Tech</span>
      </a>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" aria-label="Alternar tema">
          <span id="theme-icon">☀️</span>
        </button>
      </div>
    </header>

    <main class="admin-main twofa-shell">
      <div class="card">
        <div class="twofa-icon">🔐</div>
        <h1 class="admin-title" style="margin-bottom:6px;">Confirme que é você</h1>
        <p class="admin-subtitle" style="margin-bottom:20px;">
          Por segurança, pedimos uma segunda confirmação antes de liberar o acesso.
        </p>

        <div class="question-box" id="question-text">Carregando pergunta...</div>

        <form id="form2fa">
          <div class="field">
            <label for="resposta">Sua resposta</label>
            <input id="resposta" type="text" autocomplete="off" required />
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="btnConfirmar">
            Confirmar
          </button>
        </form>

        <p class="attempts-note" id="attemptsNote"></p>

        <p style="text-align:center;margin-top:18px;">
          <a href="login.html" class="btn-back-pill" id="btnCancelar">← Cancelar e voltar ao login</a>
        </p>
      </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="./js/api.js"></script>
    <script src="./js/ui-theme.js"></script>
    <script src="./js/ui-toast.js"></script>
        <script src="./js/eco-helpers.js"></script>
    <script src="./js/eco-admin.js"></script>
    <script>
      initTheme();
      initThemeToggle();

      const caixaPergunta = document.getElementById("question-text");
      const inputResposta = document.getElementById("resposta");
      const nota = document.getElementById("attemptsNote");

      function mostrarTentativas(restantes) {
        nota.textContent =
          restantes != null ? `Tentativas restantes: ${restantes}` : "";
      }

      function voltarAoLogin(texto) {
        if (texto) mostrarMensagem(texto);
        setTimeout(() => window.location.replace("login.html"), texto ? 2000 : 0);
      }

      /* Se a pessoa recarregar a tela, a API devolve a mesma pergunta. */
      async function carregarPergunta() {
        const r = await api("/2fa");
        if (!r.sucesso) {
          if (r.status >= 500) return irParaErro(r.erro);
          return voltarAoLogin(r.semConexao ? r.erro : "");
        }
        caixaPergunta.textContent = r.dados.pergunta;
        mostrarTentativas(r.dados.tentativas_restantes);
      }

      document.getElementById("form2fa").addEventListener("submit", async (e) => {
        e.preventDefault();
        const resposta = inputResposta.value.trim();
        if (!resposta) {
          mostrarMensagem("Preencha a resposta.");
          return;
        }

        const btn = document.getElementById("btnConfirmar");
        btn.disabled = true;
        const r = await api("/2fa", { metodo: "POST", corpo: { resposta } });
        btn.disabled = false;

        if (r.sucesso) {
          mostrarMensagem("Identidade confirmada! Entrando...", "sucesso");
          setTimeout(() => (window.location.href = "index.html"), 800);
          return;
        }
        if (r.voltar_login) {
          btn.disabled = true;
          voltarAoLogin(r.erro);
          return;
        }
        if (r.status >= 500) return irParaErro(r.erro);
        mostrarMensagem(r.erro || "Resposta incorreta");
        mostrarTentativas(r.tentativas_restantes);
        inputResposta.value = "";
      });

      carregarPergunta();
    </script>
    <script src="js/eco-animate.js"></script>
    <script src="js/eco-interacoes.js"></script>
    <script src="js/eco-voltar.js"></script>
  </body>
</html>
