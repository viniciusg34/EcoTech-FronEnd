<!doctype html>
<html data-efeitos lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./assets/fivecom.png" type="image/x-icon" />
    <title>Consulta de Usuários — EcoTech</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/admin-shared.css" />
    <style>
      .search-row {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      .search-row .field { flex: 1; min-width: 220px; margin-bottom: 0; }
      .search-row .btn { white-space: nowrap; }
      .count-tag { color: var(--ink-3); font-size: 0.82rem; margin-bottom: 14px; }
    </style>
      <link rel="stylesheet" href="css/eco-arte-fundo.css?v=3" />
      <link rel="stylesheet" href="css/eco-animate.css" />
      <link rel="stylesheet" href="css/eco-interacoes.css?v=2" />
      <link rel="stylesheet" href="css/eco-skeleton.css" />
  </head>
  <body>
    <header class="admin-header">
      <a href="index.html" class="brand">
        <img src="./assets/logo.svg" alt="" />
        <span><em>Eco</em>Tech</span>
      </a>
      <div class="header-actions">
        <a href="perfil.html" class="icon-btn" aria-label="Perfil">👤</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Alternar tema">
          <span id="theme-icon">☀️</span>
        </button>
      </div>
    </header>

    <main class="admin-main secao-arte-fundo" data-arte-fundo="circuito-folha">
      <h1 class="admin-title">Consulta de Usuários</h1>
      <p class="admin-subtitle">
        Pesquise pelo nome (ou parte dele) para localizar usuários comuns cadastrados no sistema.
      </p>

      <div class="access-note no-print" id="accessNote" style="display:none;">
        ⚠️ Esta tela é exclusiva do perfil <strong>master</strong>.
      </div>

      <div id="content">
        <div class="card">
          <div class="search-row no-print">
            <div class="field">
              <label for="busca">Buscar por nome</label>
              <input id="busca" type="text" placeholder="Digite parte do nome…" autocomplete="off" />
            </div>
            <div style="display:flex;align-items:flex-end;gap:10px;">
              <button class="btn btn-ghost" id="btnLimpar" type="button">Limpar</button>
              <button class="btn btn-primary" id="btnPdf" type="button">⬇ Baixar lista em PDF</button>
            </div>
          </div>

          <p class="count-tag sk sk-curto" id="countTag" style="--sk-w: 18ch"></p>

          <div class="table-wrap">
            <table class="data-table" id="tabelaUsuarios">
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>E-mail</th>
                  <th>CPF</th>
                  <th class="no-print">Ação</th>
                </tr>
              </thead>
              <tbody id="tbodyUsuarios" data-sk-linhas="6">
              </tbody>
            </table>
          </div>

          <div class="empty-state" id="emptyState" style="display:none;">
            <span class="emoji">🔍</span>
            Nenhum usuário encontrado para essa busca.
          </div>
        </div>
      </div>
    </main>

    <!-- Modal de confirmação de exclusão (sem alert nativo) -->
    <div class="modal-overlay" id="modalExcluir">
      <div class="modal-box">
        <h3>Excluir usuário?</h3>
        <p id="modalExcluirTexto">Esta ação não pode ser desfeita.</p>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="btnCancelarExclusao">Cancelar</button>
          <button class="btn btn-danger" id="btnConfirmarExclusao">Excluir</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="./js/ui-theme.js"></script>
    <script src="./js/ui-toast.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
    <script src="./js/config.js?v=6"></script>
    <script src="./js/api.js?v=8"></script>
    <script src="./js/eco-skeleton.js"></script>
    <script src="./js/eco-helpers.js?v=2"></script>
    <script src="./js/eco-admin.js?v=3"></script>
    <script>
      initTheme();
      initThemeToggle();

      const sessao = getSession();
      let acessoLiberado = true;
      if (!sessao) {
        window.location.replace("login.html");
      } else if (!isMaster(sessao)) {
        bloquearAcesso();
      }

      function bloquearAcesso() {
        acessoLiberado = false;
        document.getElementById("accessNote").style.display = "flex";
        document.getElementById("content").style.display = "none";
      }

      let usuarios = [];
      let totalEncontrado = 0;
      let idPendenteExclusao = null;
      let ultimaBusca = 0;
      const esc = Api.escapeHtml;

      /* GET /admin/pessoas?busca= — a busca por nome é feita no servidor;
         o CPF já chega mascarado. */
      async function carregarUsuarios(termo) {
        if (!acessoLiberado) return;
        const numero = ++ultimaBusca;
        try {
          const r = await Admin.pessoas((termo || "").trim());
          if (numero !== ultimaBusca) return; // resposta antiga
          usuarios = r.itens;
          totalEncontrado = (r.meta && r.meta.total) || usuarios.length;
          renderizar();
        } catch (err) {
          if (numero !== ultimaBusca) return;
          if (err.status === 403) {
            bloquearAcesso();
            return;
          }
          console.error(err);
          document.getElementById("tbodyUsuarios").innerHTML =
            '<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--danger);">Não foi possível carregar os usuários. Verifique sua conexão.</td></tr>';
        }
      }

      function renderizar() {
        const tbody = document.getElementById("tbodyUsuarios");
        document.getElementById("countTag").textContent =
          `${totalEncontrado} usuário(s) encontrado(s)` +
          (totalEncontrado > usuarios.length ? ` — mostrando ${usuarios.length}` : "");

        if (usuarios.length === 0) {
          tbody.innerHTML = "";
          document.getElementById("emptyState").style.display = "block";
          return;
        }
        document.getElementById("emptyState").style.display = "none";

        tbody.innerHTML = usuarios
          .map(
            (u) => `
          <tr data-id="${esc(u.id)}">
            <td>${esc(u.nome || "—")}</td>
            <td>${esc(u.email || "—")}</td>
            <td>${esc(u.cpf_mascarado || u.cpf || "—")}</td>
            <td class="no-print">
              <button class="btn btn-danger" style="padding:8px 14px;font-size:0.8rem;" data-excluir="${esc(u.id)}">
                Excluir
              </button>
            </td>
          </tr>`,
          )
          .join("");

        tbody.querySelectorAll("[data-excluir]").forEach((btn) => {
          btn.addEventListener("click", () => abrirModalExclusao(btn.getAttribute("data-excluir")));
        });
      }

      let temporizadorBusca = null;
      function buscarComAtraso(valor) {
        clearTimeout(temporizadorBusca);
        temporizadorBusca = setTimeout(() => carregarUsuarios(valor), 300);
      }

      document.getElementById("busca").addEventListener("input", (e) => buscarComAtraso(e.target.value));
      document.getElementById("btnLimpar").addEventListener("click", () => {
        document.getElementById("busca").value = "";
        carregarUsuarios("");
      });
      /* Baixar a lista em PDF (jsPDF): busca todas as páginas da pesquisa
         atual no servidor; o CPF já vem mascarado da API. */
      function montarPdf(lista, busca) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: "pt", format: "a4" });
        doc.setFontSize(16);
        doc.text("EcoTech — Lista de usuários", 40, 48);
        doc.setFontSize(10);
        doc.text(
          `Gerado em ${new Date().toLocaleString("pt-BR")} • ${lista.length} usuário(s)` +
            (busca ? ` • busca: "${busca}"` : ""),
          40,
          66,
        );
        doc.autoTable({
          startY: 84,
          head: [["Nome", "E-mail", "CPF"]],
          body: lista.map((u) => [u.nome || "—", u.email || "—", u.cpf_mascarado || u.cpf || "—"]),
          styles: { fontSize: 9 },
          headStyles: { fillColor: [67, 160, 71] },
          margin: { left: 40, right: 40 },
        });
        return doc;
      }

      document.getElementById("btnPdf").addEventListener("click", async () => {
        if (!acessoLiberado) return;
        const btn = document.getElementById("btnPdf");
        const textoOriginal = btn.textContent;
        if (!window.jspdf || !window.jspdf.jsPDF) {
          showToast("Não foi possível carregar o gerador de PDF. Verifique sua conexão.");
          return;
        }
        btn.disabled = true;
        btn.textContent = "Gerando PDF…";
        try {
          const busca = document.getElementById("busca").value.trim();
          const lista = await Admin.todasPessoas(busca);
          montarPdf(lista, busca).save("usuarios-ecotech.pdf");
          showToast("PDF gerado com a lista de usuários.");
        } catch (err) {
          Api.showError(err, "Não foi possível gerar o PDF. Tente novamente.");
        } finally {
          btn.disabled = false;
          btn.textContent = textoOriginal;
        }
      });

      function abrirModalExclusao(id) {
        idPendenteExclusao = id;
        const u = usuarios.find((x) => String(x.id) === String(id));
        document.getElementById("modalExcluirTexto").textContent =
          `Tem certeza que deseja excluir "${u ? u.nome : "este usuário"}"? Esta ação não pode ser desfeita.`;
        document.getElementById("modalExcluir").classList.add("show");
      }
      function fecharModalExclusao() {
        document.getElementById("modalExcluir").classList.remove("show");
        idPendenteExclusao = null;
      }
      document.getElementById("btnCancelarExclusao").addEventListener("click", fecharModalExclusao);
      document.getElementById("modalExcluir").addEventListener("click", (e) => {
        if (e.target.id === "modalExcluir") fecharModalExclusao();
      });

      document.getElementById("btnConfirmarExclusao").addEventListener("click", async () => {
        if (!idPendenteExclusao) return;
        const btn = document.getElementById("btnConfirmarExclusao");
        btn.disabled = true;
        btn.textContent = "Excluindo…";
        try {
          await Admin.excluirPessoa(idPendenteExclusao); // DELETE /admin/pessoas/{id}
          usuarios = usuarios.filter((u) => String(u.id) !== String(idPendenteExclusao));
          totalEncontrado = Math.max(0, totalEncontrado - 1);
          renderizar();
          showToast("Usuário excluído com sucesso.");
        } catch (err) {
          console.error(err);
          Api.showError(err, "Não foi possível excluir. Tente novamente.");
        } finally {
          btn.disabled = false;
          btn.textContent = "Excluir";
          fecharModalExclusao();
        }
      });

      carregarUsuarios("");
    </script>
    <script src="js/eco-animate.js"></script>
    <script src="js/eco-interacoes.js"></script>
    <script src="js/eco-voltar.js?v=3"></script>
    <script src="js/eco-arte-fundo.js?v=2"></script>
      <script src="js/eco-acessibilidade.js"></script>
  </body>
</html>
