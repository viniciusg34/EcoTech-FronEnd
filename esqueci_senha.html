<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="assets/fivecom.png" type="image/x-icon" />
    <title>Recuperar Senha — EcoTech</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/admin-shared.css" />
    <link rel="stylesheet" href="./css/eco-animate.css" />
    <link rel="stylesheet" href="./css/eco-interacoes.css" />
    <style>
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .recuperar-shell {
        width: 100%;
        max-width: 460px;
        padding: 20px;
      }
      .recuperar-icon {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: var(--sage-50);
        border: 1.5px solid var(--sage-100);
        display: grid;
        place-items: center;
        font-size: 26px;
        margin: 0 auto 16px;
      }
      .steps-indicator {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-bottom: 26px;
      }
      .steps-indicator span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--sage-100);
        transition: background 0.3s, transform 0.3s;
      }
      .steps-indicator span.ativo {
        background: var(--sage-500);
        transform: scale(1.3);
      }
      .steps-indicator span.concluido {
        background: var(--sage-300, var(--sage-400));
      }
      .question-box {
        background: var(--sage-50);
        border: 1.5px solid var(--sage-100);
        border-radius: var(--br-md);
        padding: 16px 18px;
        margin-bottom: 18px;
        font-weight: 700;
        color: var(--ink-2);
        text-align: center;
      }
      .attempts-note {
        font-size: 0.8rem;
        color: var(--ink-3);
        margin-top: 12px;
        text-align: center;
      }
      .attempts-note strong { color: var(--danger); }
      .painel-etapa { display: none; text-align: center; }
      .painel-etapa.ativa { display: block; animation: tabFadeIn 0.3s cubic-bezier(0.22,1,0.36,1); }
      @keyframes tabFadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      .painel-etapa .field { text-align: left; }
      .sucesso-icone { font-size: 46px; margin-bottom: 6px; }
    </style>
  </head>
  <body>
    <button class="theme-toggle" id="theme-toggle" aria-label="Alternar tema" style="position:fixed; top:20px; right:20px;">
      <span id="theme-icon">☀️</span>
    </button>

    <main class="recuperar-shell">
      <div class="card">
        <div class="recuperar-icon">🔑</div>
        <h1 class="admin-title" style="text-align:center; margin-bottom:6px;">Recuperar senha</h1>
        <p class="admin-subtitle" style="text-align:center; margin-bottom:22px;">
          Vamos confirmar sua identidade em 3 passos rápidos.
        </p>

        <div class="steps-indicator" id="steps-indicator">
          <span data-step="1"></span>
          <span data-step="2"></span>
          <span data-step="3"></span>
        </div>

        <!-- ═══ ETAPA 1 — E-MAIL ═══ -->
        <div class="painel-etapa ativa" data-etapa="1">
          <div class="field">
            <label for="email-recuperar">Qual o seu e-mail cadastrado?</label>
            <input id="email-recuperar" type="email" placeholder="seu@email.com" autocomplete="email" required />
          </div>
          <button type="button" class="btn btn-primary btn-block" id="btn-buscar-email">
            Continuar
          </button>
        </div>

        <!-- ═══ ETAPA 2 — PERGUNTA DE SEGURANÇA ═══ -->
        <div class="painel-etapa" data-etapa="2">
          <div class="question-box" id="pergunta-seguranca">Carregando pergunta...</div>
          <div class="field">
            <label for="resposta-seguranca">Sua resposta</label>
            <input id="resposta-seguranca" type="text" autocomplete="off" required />
          </div>
          <button type="button" class="btn btn-primary btn-block" id="btn-confirmar-resposta">
            Confirmar
          </button>
          <p class="attempts-note" id="attempts-note"></p>
        </div>

        <!-- ═══ ETAPA 3 — NOVA SENHA ═══ -->
        <div class="painel-etapa" data-etapa="3">
          <div class="field">
            <label for="nova-senha">Nova senha</label>
            <input id="nova-senha" type="password" autocomplete="new-password" required />
            <small class="hint">Mínimo 8 caracteres, com letra maiúscula, minúscula e número.</small>
          </div>
          <div class="field">
            <label for="confirmar-nova-senha">Confirmar nova senha</label>
            <input id="confirmar-nova-senha" type="password" autocomplete="new-password" required />
          </div>
          <button type="button" class="btn btn-primary btn-block" id="btn-salvar-nova-senha">
            Salvar nova senha
          </button>
        </div>

        <!-- ═══ ETAPA 4 — SUCESSO ═══ -->
        <div class="painel-etapa" data-etapa="4">
          <div class="sucesso-icone">✅</div>
          <h2 style="margin-bottom:8px;">Senha alterada!</h2>
          <p class="admin-subtitle" style="margin-bottom:22px;">
            Já pode entrar na sua conta com a nova senha.
          </p>
          <a href="login.html" class="btn btn-primary btn-block" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">
            Ir para o login
          </a>
        </div>
      </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="./js/api.js"></script>
    <script src="./js/ui-theme.js"></script>
    <script src="./js/ui-toast.js"></script>
    <script src="./js/eco-helpers.js"></script>
    <script>
      initTheme();
      initThemeToggle();

      /* A API ainda não tem rota de recuperação de senha. */
      document.getElementById("btn-buscar-email").addEventListener("click", () => {
        mostrarMensagem(
          "A recuperação de senha ainda não está disponível. Fale com o administrador.",
        );
      });
    </script>
    <script src="js/eco-animate.js"></script>
    <script src="js/eco-interacoes.js"></script>
    <script src="js/eco-voltar.js"></script>
  </body>
</html>
