<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./assets/fivecom.png" type="image/x-icon" />
    <title>Alterar Senha — EcoTech</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/admin-shared.css" />
    <style>
      .senha-shell { max-width: 460px; margin: 0 auto; }
      .eye-toggle {
        position: absolute;
        right: 14px;
        top: 40px;
        cursor: pointer;
        font-size: 0.9rem;
        color: var(--ink-3);
        user-select: none;
      }
      .field { position: relative; }
      /* Remove o "olho" nativo do Edge/IE nos campos de senha —
         ele ficava sobreposto ao nosso ícone customizado. */
      input[type="password"]::-ms-reveal,
      input[type="password"]::-ms-clear {
        display: none;
      }
    </style>
      <link rel="stylesheet" href="css/eco-animate.css" />
      <link rel="stylesheet" href="css/eco-interacoes.css" />
  </head>
  <body>
    <header class="admin-header">
      <a href="index.html" class="brand">
        <img src="./assets/logo.svg" alt="" />
        <span><em>Eco</em>Tech</span>
      </a>
      <div class="header-actions">
        <a href="perfil.html" class="icon-btn" aria-label="Perfil">👤</a>
        <button class="theme-toggle" id="theme-toggle" aria-label="Alternar tema">
          <span id="theme-icon">☀️</span>
        </button>
      </div>
    </header>

    <main class="admin-main senha-shell">
      <h1 class="admin-title">Alterar minha senha</h1>
      <p class="admin-subtitle">Apenas você tem acesso para alterar a sua própria senha.</p>

      <div class="access-note" id="masterNote" style="display:none;">
        ⚠️ Contas com perfil <strong>master</strong> são gerenciadas diretamente no banco de dados — não é possível alterar a senha por aqui.
      </div>

      <div class="card" id="formCard">
        <form id="formAlterarSenha">
          <div class="field">
            <label for="senhaAtual">Senha atual</label>
            <input id="senhaAtual" name="senha_atual" type="password" required autocomplete="current-password" />
            <span class="eye-toggle" onclick="togglePassword('senhaAtual')">mostrar</span>
          </div>
          <div class="field">
            <label for="novaSenha">Nova senha</label>
            <input id="novaSenha" name="nova_senha" type="password" required autocomplete="new-password" />
            <span class="eye-toggle" onclick="togglePassword('novaSenha')">mostrar</span>
            <small class="hint">Exatamente 8 letras, sem números ou símbolos.</small>
          </div>
          <div class="field">
            <label for="confirmarNovaSenha">Confirmar nova senha</label>
            <input id="confirmarNovaSenha" name="confirmar_senha" type="password" required autocomplete="new-password" />
            <span class="eye-toggle" onclick="togglePassword('confirmarNovaSenha')">mostrar</span>
          </div>
          <button type="submit" class="btn btn-primary btn-block" id="btnSalvar">Salvar nova senha</button>
        </form>
      </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="./js/api.js"></script>
    <script src="./js/ui-theme.js"></script>
    <script src="./js/ui-toast.js"></script>
    <script src="./js/eco-session.js"></script>
    <script src="./js/eco-helpers.js"></script>
    <script>
      initTheme();
      initThemeToggle();

      const form = document.getElementById("formAlterarSenha");
      protegerTela(["comum"]);

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        limparErrosCampos();

        const senha_atual = document.getElementById("senhaAtual").value;
        const nova_senha = document.getElementById("novaSenha").value;
        const confirmar_senha = document.getElementById("confirmarNovaSenha").value;

        if (!senhaValidaApi(nova_senha)) {
          mostrarErrosCampos({ nova_senha: "A senha deve ter exatamente 8 letras." });
          return;
        }
        if (nova_senha !== confirmar_senha) {
          mostrarErrosCampos({ confirmar_senha: "As senhas não coincidem." });
          return;
        }

        const btn = document.getElementById("btnSalvar");
        btn.disabled = true;
        btn.textContent = "Salvando...";
        const r = await api("/alterar-senha", {
          metodo: "POST",
          corpo: { senha_atual, nova_senha, confirmar_senha },
        });
        btn.disabled = false;
        btn.textContent = "Salvar nova senha";

        if (r.sucesso) {
          mostrarMensagem(r.dados?.mensagem || "Senha alterada com sucesso!", "sucesso");
          form.reset();
        } else if (r.campos) {
          mostrarErrosCampos(r.campos);
          mostrarMensagem(r.erro);
        } else {
          tratarFalha(r);
        }
      });
    </script>
    <script src="js/eco-animate.js"></script>
    <script src="js/eco-interacoes.js"></script>
    <script src="js/eco-voltar.js"></script>
  </body>
</html>
